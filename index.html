:root{color-scheme:light;--ink:#252c3c;--blue:#344cba;--muted:#6c6c76}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#d4c7dc;font-family:Satoshi,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:5px}
.chi-scene{isolation:isolate;position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;padding:0 42px}
.scene-image,.scene-shade{position:absolute;inset:0;z-index:-2;pointer-events:none}
.scene-image{overflow:hidden;background:#d4c7dc}
.scene-image img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;animation:scene-arrive 1.8s cubic-bezier(.2,.7,.2,1) both}
.scene-shade{z-index:-1;background:linear-gradient(180deg,rgba(246,240,247,.23),transparent 17%,transparent 85%,rgba(243,235,244,.55))}
.chi-header{height:106px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:24px}
.chi-wordmark{font-size:30px;font-weight:600;letter-spacing:-1.7px;text-decoration:none;line-height:1}
.chi-wordmark>span:not(.wordmark-point){font-weight:400}.wordmark-point{color:var(--blue)}
.header-note{font-size:11px;letter-spacing:.015em;margin:0;color:#343847}
.panel-stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;min-width:0;padding:36px 0 46px}
.stealth-panel{position:relative;text-align:center;width:468px;max-width:100%;padding:43px 39px 30px;border-radius:48px;background:linear-gradient(145deg,#fffefc 0%,#fdfcfb 65%,#f7f7f8 100%);border:1px solid rgba(255,255,255,.96);box-shadow:0 2px 0 rgba(255,255,255,.8) inset,0 -3px 2px rgba(121,109,125,.05) inset,0 2px 4px rgba(62,47,89,.03),0 22px 60px -18px rgba(66,50,100,.22),0 50px 110px -35px rgba(102,67,93,.15);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.7,.2,1),filter .45s;animation:panel-arrive .9s .12s cubic-bezier(.2,.7,.2,1) backwards}
.stealth-status{display:flex;justify-content:center;align-items:center;gap:9px;font-size:9px;letter-spacing:1.35px;text-transform:uppercase;margin:0 0 31px;color:#626575}
.stealth-panel h1{margin:0;font-weight:400;font-size:60px;line-height:1.06;letter-spacing:-3.2px}
.stealth-panel h1 em{display:inline-block;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:74px;line-height:1.03;letter-spacing:-2.3px;color:#5267aa}
.chi-intro{font-size:13px;line-height:1.75;color:var(--muted);max-width:300px;margin:26px auto 29px;text-wrap:pretty}
.chi-intro>span{display:block;margin-top:6px}.chi-signup{min-height:103px}
.chi-input-row{display:flex;gap:5px;align-items:center;padding:5px;border-radius:11px;border:1px solid #e0e1e7;background:#f4f4f7;transition:border-color .2s,box-shadow .2s}
.chi-input-row:focus-within{border-color:#7386bd;box-shadow:0 0 0 3px #5f74ba12}
.chi-input-row input{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:0;color:var(--ink);padding:11px 8px;font-size:11px}
.chi-input-row input::placeholder{color:#777b89;opacity:1}
.chi-input-row button{display:flex;align-items:center;justify-content:center;gap:12px;flex-shrink:0;min-height:41px;border:1px solid #344cba;border-radius:7px;padding:10px 13px;background:var(--blue);color:white;font-size:10px;box-shadow:0 2px 4px #344cba18;transition:background .2s,box-shadow .2s}
.chi-input-row button:hover:not(:disabled){background:#263eaa;box-shadow:0 3px 8px #344cba30}
.chi-input-row button svg{width:15px;height:15px;transition:transform .2s}.chi-input-row button:hover:not(:disabled) svg{transform:translateX(2px)}
.chi-input-row button:disabled{opacity:.65;cursor:wait}
.signup-note{font-size:9px;line-height:1.5;color:#787b86;margin:12px 0 0;min-height:14px}.signup-error{color:#a03e4e}
.chi-trap{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.chi-success{min-height:103px;display:flex;align-items:center;justify-content:center;gap:13px;text-align:left;font-size:13px}
.success-mark{display:grid;place-items:center;border-radius:50%;width:34px;height:34px;background:#eef0f8;color:var(--blue)}
.chi-success small{display:block;font-size:10px;color:var(--muted);margin-top:6px}
.panel-signature{display:flex;align-items:center;justify-content:center;gap:13px;margin-top:25px;font-size:8px;letter-spacing:1.15px;text-transform:uppercase;color:#838694}
.signature-line{width:19px;height:1px;background:#dcdde5}
.chi-footer{height:77px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px;font-size:10px;color:#424452;flex-shrink:0}
.artwork-toggle{justify-self:end;display:flex;gap:11px;align-items:center;padding:9px 0 9px 12px;border:0;background:transparent;font-size:10px;color:inherit}
.artwork-toggle svg{width:14px;height:14px;transition:transform .2s}.artwork-toggle:hover svg{transform:translate(2px,-2px)}
.close-artwork{font-size:20px;line-height:14px;width:14px;font-weight:400}
.artwork-open .stealth-panel{opacity:0;transform:translateY(12px) scale(.97);filter:blur(6px);pointer-events:none}
@keyframes scene-arrive{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:scale(1)}}
@keyframes panel-arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:1600px){.chi-scene{padding:0 54px}.chi-header{height:116px}.stealth-panel{width:490px;padding:49px 44px 35px}.stealth-panel h1{font-size:64px}.stealth-panel h1 em{font-size:80px}.chi-intro{font-size:14px;margin-top:29px;margin-bottom:34px}.panel-signature{margin-top:30px}.chi-footer{height:85px}}
@media(max-width:900px){.chi-scene{padding:0 28px}.scene-image img{object-position:47% center}.chi-header{height:90px}.panel-stage{padding:40px 0 60px}.stealth-panel{width:440px;padding:40px 32px 29px}.chi-footer{height:70px}}
@media(max-width:600px){.chi-scene{padding:0 23px;min-height:100svh}.chi-header{height:82px;align-items:center}.chi-wordmark{font-size:27px}.header-note{font-size:9px;max-width:98px;text-align:right;line-height:1.5}.scene-image img{object-position:29% center}.panel-stage{padding:96px 0 64px}.stealth-panel{width:354px;border-radius:37px;padding:33px 25px 27px}.stealth-status{font-size:7px;letter-spacing:1.15px;margin-bottom:26px;gap:8px}.stealth-panel h1{font-size:50px;letter-spacing:-2.6px}.stealth-panel h1 em{font-size:64px;letter-spacing:-1.9px}.chi-intro{font-size:12px;max-width:260px;line-height:1.75;margin:22px auto 25px}.chi-input-row{gap:2px;padding:4px}.chi-input-row input{font-size:10px;padding:10px 5px}.chi-input-row button{font-size:9px;gap:7px;padding:10px}.chi-input-row button svg{width:13px}.signup-label{font-size:9px}.signup-note{font-size:8px;margin-top:11px}.panel-signature{margin-top:19px;font-size:7px;letter-spacing:1px;gap:10px}.chi-footer{height:62px;grid-template-columns:1fr 1fr;gap:12px;font-size:9px}.footer-tagline{display:none}.artwork-toggle{font-size:9px}}
@media(max-width:360px){.chi-scene{padding:0 17px}.stealth-panel{padding-left:20px;padding-right:20px}.stealth-panel h1{font-size:46px}.stealth-panel h1 em{font-size:60px}.chi-input-row button{padding:10px 8px;gap:5px}}
@media(max-height:760px) and (min-width:601px){.chi-header{height:78px}.panel-stage{padding:14px 0 20px}.stealth-panel{padding-top:32px;padding-bottom:26px}.stealth-status{margin-bottom:23px}.chi-intro{margin-top:20px;margin-bottom:23px}.panel-signature{margin-top:16px}.chi-footer{height:60px}}
@media(max-width:600px){.chi-input-row input{font-size:16px;padding:10px 7px}.chi-input-row input::placeholder{font-size:11px}.signup-label,.signup-note{font-size:10px}.signup-note{min-height:15px}.chi-input-row button{min-height:44px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<script>(() => {
  'use strict';
  // This self-contained design preview makes no network requests and collects no email.
  const scene = document.querySelector('.chi-scene');
  const panel = document.querySelector('.stealth-panel');
  const toggle = document.querySelector('.artwork-toggle');
  const toggleLabel = toggle.querySelector('.toggle-label');
  const openIcon = toggle.querySelector('svg');
  const closeIcon = toggle.querySelector('.close-artwork');
  const form = document.querySelector('form');
  const feedback = document.getElementById('signup-feedback');
  let artworkOpen = false;
  function showArtwork(open) {
    artworkOpen = open;
    scene.classList.toggle('artwork-open', open);
    panel.inert = open;
    toggle.setAttribute('aria-pressed', String(open));
    toggle.setAttribute('aria-label', open ? 'Return to Chi Lab' : 'View the full artwork');
    toggleLabel.textContent = open ? 'Back to Chi Lab' : 'A closer look';
    openIcon.style.display = open ? 'none' : '';
    closeIcon.hidden = !open;
  }
  toggle.addEventListener('click', () => showArtwork(!artworkOpen));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && artworkOpen) {
      showArtwork(false);
      toggle.focus();
    }
  });
  document.querySelector('.chi-wordmark').addEventListener('click', () => showArtwork(false));
  form.addEventListener('submit', event => {
    event.preventDefault();
    feedback.textContent = 'This is a design preview. Your email has not been submitted.';
  });
})();</script>
